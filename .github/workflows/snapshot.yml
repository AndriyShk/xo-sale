name: snapshot
# Records Legion deposits + the XO price into data/history.json every ~10 minutes (GitHub may delay scheduled runs).
on:
  schedule: [{ cron: '*/10 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: snapshot, cancel-in-progress: false }
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/snapshot.mjs
      - name: commit
        run: |
          git config user.name "xo-jumper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || (git commit -m "data: snapshot" && git push)
